name: Pipeline Health Check
# Monitors every 6 hours that all scrapers, forecast-24h, HRRR feed, Cloud Scheduler
# jobs, model freshness/size, and GCS bucket permissions are healthy and up to date.
# Pull requests run offline syntax and feature-schema validation (GCP WIF restricts
# live credentials strictly to refs/heads/main).

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"   # Every 6 hours at :30 (after :05/:15/:20 jobs finish)
  push:
    branches: [ main ]
    paths:
      - "scripts/health_check.py"
      - ".github/workflows/health-check.yml"
  pull_request:
    paths:
      - "cloud_function/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REGION: ${{ vars.REGION }}
  BUCKET_NAME: ${{ vars.BUCKET_NAME }}
  ENERGY_PREFIX: energy
  DEPLOYER_SA: ${{ vars.DEPLOYER_SA }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}

jobs:
  offline-check:
    if: github.repository_owner != 'drdave-teaching'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "cloud_function/forecast-24h/requirements.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cloud_function/forecast-24h/requirements.txt requests

      - name: Verify Python syntax and feature engineering offline
        run: |
          python -m py_compile cloud_function/*/*.py scripts/*.py
          python - <<'PY'
          import sys
          import numpy as np
          import pandas as pd

          sys.path.insert(0, "cloud_function/forecast-24h")
          import main as f24

          idx = pd.date_range("2025-11-23 00:00Z", periods=168, freq="h")
          w = pd.DataFrame(
              {
                  "temp_f": np.sin(np.arange(168) / 3.8) * 15.0 + 40.0,
                  "dewpoint_f": 30.0,
                  "rel_humidity_pct": 65.0,
                  "wind_speed_mph": 10.0,
                  "cloud_cover_pct": 30.0,
              },
              index=idx,
          )
          load = pd.Series(3200.0, index=idx)
          X = f24.make_features(idx[-48:], w, load)
          assert list(X.columns) == f24.FEATURES, "Feature schema mismatch"
          assert len(f24.FEATURES) >= 11, f"Expected >=11 features, got {len(f24.FEATURES)}"
          assert X.isna().sum().sum() == 0, "Unexpected NaNs in computed features"
          print(f"Offline check passed ({len(f24.FEATURES)} features).")
          PY

  health-check:
    if: github.repository_owner != 'drdave-teaching' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: offline-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "cloud_function/forecast-24h/requirements.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cloud_function/forecast-24h/requirements.txt requests

      - name: Auth (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Run full pipeline health checks
        run: |
          python scripts/health_check.py \
            --project "${PROJECT_ID}" \
            --bucket "${BUCKET_NAME}" \
            --region "${REGION}" \
            --prefix "${ENERGY_PREFIX}" \
            --check-gcp
