name: Retrain QRF Model (Manual Dispatch Only)
# Scheduled daily retrain is paused after resetting main to Dr. Dave's canonical
# 11-feature Final Project baseline; manual dispatch remains available if needed.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate & train without overwriting GCS model_qrf.joblib"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  BUCKET_NAME: ${{ vars.BUCKET_NAME }}
  ENERGY_PREFIX: energy
  DEPLOYER_SA: ${{ vars.DEPLOYER_SA }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}

jobs:
  retrain:
    if: github.repository_owner != 'drdave-teaching'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "cloud_function/forecast-24h/requirements.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cloud_function/forecast-24h/requirements.txt requests

      - name: Auth (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Retrain & upload rolling QRF model to GCS
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          EXTRA_ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          python scripts/retrain_model.py \
            --project "${PROJECT_ID}" \
            --bucket "${BUCKET_NAME}" \
            --prefix "${ENERGY_PREFIX}" \
            $EXTRA_ARGS
